---
- name: "Include vars file"
  ansible.builtin.include_vars:
    file: '../vars/main.yml'

- name: "Include config hosts"
  ansible.builtin.include_tasks: './config_hosts.yml'
  when: inventory_hostname == master_hostname

- name: "Include disable SWAP"
  ansible.builtin.include_tasks: './disable_swap.yml'

- name: "Include create config files"
  ansible.builtin.include_tasks: './config_files.yml'
  when: inventory_hostname == master_hostname

- name: "Include install containerd"
  ansible.builtin.include_tasks: './install_containerd.yml'

- name: "Include install kubernetes"
  ansible.builtin.include_tasks: './install_kubernetes.yml'

- name: "Include config ports"
  ansible.builtin.include_tasks: './config_ports.yml'
  when: inventory_hostname == master_hostname

- name: "Include start cluster"
  ansible.builtin.include_tasks: './start_cluster.yml'
  when: inventory_hostname == master_hostname

- name: "Include install flannel"
  ansible.builtin.include_tasks: './install_flannel.yml'
  when: inventory_hostname == master_hostname

- name: "Include single node cluster config"
  ansible.builtin.include_tasks: './single_node.yml'
  when: install_single_node_cluster and inventory_hostname == master_hostname
